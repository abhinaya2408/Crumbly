<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory — Bakery Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/owner.css">
<link rel="stylesheet" href="css/crumbly-extra.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="owner-dashboard.html" class="brand"><span class="brand-mark">🍰</span> Crumbly <span style="font-size:12px;font-weight:600;color:var(--color-text-muted);margin-left:6px;">Bakery Portal</span></a>
    <div class="nav-links">
      <a href="#" onclick="handleOwnerLogout(); return false;">Logout</a>
    </div>
  </div>
</nav>

<div class="owner-shell">
  <aside class="owner-sidebar" id="ownerSidebar">
    <div class="side-label">Overview</div>
    <a href="owner-dashboard.html" class="side-link">📊 Dashboard</a>
    <a href="owner-analytics.html" class="side-link">📈 Analytics</a>
    <div class="side-label">Orders</div>
    <a href="owner-dashboard.html" class="side-link">📦 All Orders</a>
    <div class="side-label">Manage</div>
    <a href="owner-pickup-slots.html" class="side-link">🕐 Pickup Slots</a>
    <a href="owner-inventory.html" class="side-link active">📦 Inventory</a>
    <div class="side-label">Other</div>
    <a href="/admin/" class="side-link" target="_blank" rel="noopener">🛠️ Django Admin</a>
  </aside>

  <main class="owner-main">
    <button class="btn btn-secondary btn-sm mobile-sidebar-toggle" id="mobileSidebarToggle">☰ Menu</button>
    <div class="owner-topbar">
      <h1>Inventory</h1>
    </div>
    <div id="lowStockBannerInv"></div>

    <h3>Add Ingredient / Item</h3>
    <div class="inline-form">
      <div class="form-group">
        <label for="itemName">Name</label>
        <input type="text" id="itemName" placeholder="e.g. Chocolate Cream">
      </div>
      <div class="form-group">
        <label for="itemCategory">Category</label>
        <select id="itemCategory">
          <option value="CREAM">Cream</option>
          <option value="FLAVOR_BASE">Flavor / Base</option>
          <option value="DECORATION">Decoration</option>
          <option value="PACKAGING">Packaging</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="itemQuantity">Quantity</label>
        <input type="number" id="itemQuantity" min="0" step="0.1" value="0" style="width:100px;">
      </div>
      <div class="form-group">
        <label for="itemUnit">Unit</label>
        <input type="text" id="itemUnit" placeholder="kg" value="kg" style="width:80px;">
      </div>
      <div class="form-group">
        <label for="itemMinimum">Minimum Stock</label>
        <input type="number" id="itemMinimum" min="0" step="0.1" value="0" style="width:110px;">
      </div>
      <button class="btn btn-primary" id="addItemBtn">Add Item</button>
    </div>
    <div class="field-error" id="itemFormError"></div>

    <table class="orders-table" style="margin-top:var(--sp-4);">
      <thead>
        <tr><th>Item</th><th>Category</th><th>Quantity</th><th>Minimum</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="inventoryBody"></tbody>
    </table>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/inventory-admin.js"></script>
<script>initOwnerInventoryPage();</script>
</body>
</html>
