<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Sign In — Crumbly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">🍰</span> Crumbly</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="back-home">← Back to home</a>
    <div class="auth-icon">🎓</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in with your college account to order your cake.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" placeholder="yourname@yourcollege.edu" autocomplete="email">
        <div class="field-error" id="emailError">Please enter a valid email address.</div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        <div class="field-error" id="passwordError">Password is required.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="demo-banner" style="margin-top: var(--sp-5); margin-bottom:0;">
      <strong>Demo student account</strong>
      ananya.sharma@yourcollege.edu · demo1234
    </div>

    <p class="auth-footer-link">New to the bakery? <a href="student-register.html">Create an account</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>initStudentLoginPage();</script>
</body>
</html>
